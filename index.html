<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lexicon NL</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Noto+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EDF0F4;--surface:#FFFFFF;--surface2:#E3E8EF;--ink:#131C29;--muted:#586579;--line:#D2D9E3;
  --accent:#0B6E75;--accent-ink:#FFFFFF;--accent-soft:#D5EDEF;
  --ok:#1B7F4F;--ok-soft:#D8F0E3;--bad:#B63434;--bad-soft:#F7DCDC;--warn:#8A5F00;--warn-soft:#F6EBCB;
  --shadow:0 1px 2px rgba(19,28,41,.06),0 6px 20px rgba(19,28,41,.06);
  --font-body:"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Bricolage Grotesque","Noto Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D131A;--surface:#161F29;--surface2:#1F2A36;--ink:#E8EEF4;--muted:#93A1B3;--line:#2A3745;
  --accent:#4EC2B8;--accent-ink:#06211F;--accent-soft:#16363A;
  --ok:#5CD08F;--ok-soft:#153726;--bad:#F08585;--bad-soft:#3C1E1F;--warn:#E6B94E;--warn-soft:#3A2F12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);}}
:root[data-theme="dark"]{
  --bg:#0D131A;--surface:#161F29;--surface2:#1F2A36;--ink:#E8EEF4;--muted:#93A1B3;--line:#2A3745;
  --accent:#4EC2B8;--accent-ink:#06211F;--accent-soft:#16363A;
  --ok:#5CD08F;--ok-soft:#153726;--bad:#F08585;--bad-soft:#3C1E1F;--warn:#E6B94E;--warn-soft:#3A2F12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;padding-inline:16px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-block:12px 96px}
.top{display:flex;align-items:baseline;justify-content:space-between;padding:6px 2px 14px}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.01em}
.top small{color:var(--muted);font-size:13px}
h2{font-family:var(--font-display);font-size:26px;line-height:1.15;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--font-display);font-size:18px;margin:0}
.lead{color:var(--muted);margin:0 0 16px}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row.wrap{flex-wrap:wrap}
.big{font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.btn.icon{min-width:48px;padding:0 12px}
.card-task{display:flex;flex-direction:column;gap:10px}
.card-task .meta{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.card-task .note{color:var(--muted);font-size:14px;margin:0}
.meter{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;background:none;border:0;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;font-weight:600}
.tabs button[aria-current="true"]{color:var(--accent)}
.tabs svg{width:24px;height:24px}
.word{font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1.15;letter-spacing:-.01em;overflow-wrap:anywhere;text-wrap:balance}
.ipa{font-family:var(--font-body);color:var(--accent);font-size:19px;overflow-wrap:anywhere}
.ru{font-size:19px;font-weight:500}
.prompt{padding:20px 16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;min-height:58px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;justify-content:center;gap:2px;font-size:18px}
.opt .ipa{font-size:15px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.field{width:100%;min-height:56px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:20px}
.fb{border-radius:16px;padding:14px 16px;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.info{background:var(--warn-soft);color:var(--warn)}
.ex{margin:0 0 10px}
.ex p{margin:0}
.ex .en{font-weight:500}
.ex .tr{color:var(--muted)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.list{display:flex;flex-direction:column}
.list .li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.list .li:first-child{border-top:0}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.bar b{font-variant-numeric:tabular-nums;text-align:right}
textarea.field{padding:10px 12px;min-height:110px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600}
.phon-row{padding:10px 0;border-top:1px solid var(--line)}
.phon-row:first-child{border-top:0}
.phon-row .sym{font-family:var(--font-display);font-weight:700;font-size:19px;color:var(--accent)}
.phon-row .ex{font-size:14px;color:var(--muted);margin-left:8px}
.phon-row .desc{margin-top:4px;font-size:14px}
.tick{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.panel,.opt,.fb{animation:rise .18s ease-out}@keyframes rise{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<div id="app">
  <header class="top"><div class="brand">Lexicon NL</div><small id="topinfo"></small></header>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Разделы"><div class="in">
  <button data-tab="home" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Сегодня</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Прогресс</button>
  <button data-tab="ipa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Транскрипция</button>
  <button data-tab="audio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>Аудио</button>
</div></nav>

<script>
(function(){
"use strict";
var DATA=[];
var BYID=new Map();DATA.forEach(function(d){BYID.set(d[0],d)});
var SG=[],PH=[];DATA.forEach(function(d){(d[1].indexOf(" ")>=0?PH:SG).push(d[0])});
var H=3600e3;
var INT=[4,12,24,144,288,576,1152,2304,4320].map(function(h){return h*H});
var STAGE_NAMES=["через 4 ч","через 12 ч","через 1 день","через 6 дней","через 12 дней","через 24 дня","через 48 дней","через 96 дней","через 180 дней"];
var MAX_LEARN=20,MIN_ACTIVE=5,STREAK=3,T_NEW=10,T_RELAPSE=5,KEY="lexicon.nl.v1";
var S=null,ui={mode:"home"},view=document.getElementById("view");

function pruneStale(words){Object.keys(words).forEach(function(id){if(!BYID.has(Number(id)))delete words[id]})}
function load(){
  try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
  if(!S||!S.words)S={words:{},day:"",newToday:0,credits:0};
  if(typeof S.credits!=="number")S.credits=0;
  if(!Array.isArray(S.bks))S.bks=[];
  pruneStale(S.words);
  rollDay();
}
function save(){S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}queueSync()}
/* ---- cloud sync: progress lives in the viewer's private db subtree ---- */
var cloud={db:null,uid:null,ok:false,last:{},timer:null,busy:false,again:false,state:"local",count:0,allow:false};
var MAX_BKS=10;
function chunkOf(id){return Math.floor(Number(id)/500)}
function cpath(name){return "data-nl/users/"+cloud.uid+"/"+name}
function chunkData(words){words=words||S.words;var ch={},str={};for(var k in words){var n=chunkOf(k);(ch[n]=ch[n]||{})[k]=words[k]}for(var n in ch)str[n]=JSON.stringify(ch[n]);return{ch:ch,str:str}}
function wordCount(w){return Object.keys(w).length}
function learnedCount(w){var n=0;for(var k in w)if(w[k].s==="R")n++;return n}
function metaStr(){return JSON.stringify([S.credits,S.day,S.newToday,S.ts,S.bks||[]])}
function queueSync(){if(!cloud.ok)return;if(cloud.busy){cloud.again=true;return}clearTimeout(cloud.timer);cloud.timer=setTimeout(flush,1200)}
function flush(){
  if(!cloud.ok||cloud.busy)return Promise.resolve();
  var cnt=wordCount(S.words);
  if(cloud.count>=20&&cnt<cloud.count*0.5&&!cloud.allow){cloud.state="guard";if(ui.mode==="home"||ui.mode==="stats")render();return Promise.resolve()}
  cloud.busy=true;
  var c=chunkData(),jobs=[];
  Object.keys(c.str).forEach(function(n){if(cloud.last[n]!==c.str[n])jobs.push(function(){return cloud.db.doc(cpath("w"+n)).set({w:c.ch[n]}).then(function(){cloud.last[n]=c.str[n]})})});
  Object.keys(cloud.last).forEach(function(n){if(n!=="meta"&&!(n in c.str))jobs.push(function(){return cloud.db.doc(cpath("w"+n)).delete().then(function(){delete cloud.last[n]})})});
  var m=metaStr();
  if(cloud.last.meta!==m)jobs.push(function(){return cloud.db.doc(cpath("meta")).set({credits:S.credits||0,day:S.day||"",newToday:S.newToday||0,ts:S.ts||0,bks:S.bks||[]}).then(function(){cloud.last.meta=m})});
  var p=Promise.resolve();jobs.forEach(function(j){p=p.then(j)});
  return p.then(function(){cloud.state="cloud";cloud.count=cnt;cloud.allow=false;cloud.lastSync=Date.now()},function(){cloud.state="error"}).then(function(){cloud.busy=false;if(cloud.again){cloud.again=false;queueSync()}})
}
function fmtTime(t){var d=new Date(t);return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
function syncNow(){
  var done=function(m){ui={mode:"stats",msg:m};render()};
  if(!cloud.ok){done("Облако недоступно. Откройте страницу по ссылке из Claude и войдите в аккаунт.");return}
  ui={mode:"stats",msg:"Синхронизация…"};render();
  pullRemote().then(function(r){
    if(r.has&&r.rem.ts>(S.ts||0)){adopt(r.rem);cloud.lastSync=Date.now();done("Загружено из облака: слов "+wordCount(S.words)+".");return}
    cloud.count=r.has?wordCount(r.rem.words):0;if(r.has)S.bks=r.rem.bks;
    S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    return flush().then(function(){
      if(cloud.state==="guard")done("Синхронизация остановлена защитой: на устройстве слов намного меньше, чем в облаке.");
      else if(cloud.state==="error")done("Не удалось сохранить в облако. Попробуйте ещё раз.");
      else done("Готово, облако и устройство совпадают. Слов: "+wordCount(S.words)+", "+fmtTime(Date.now())+".")
    })
  }).catch(function(){done("Не удалось связаться с облаком. Попробуйте ещё раз.")})
}
function pullRemote(){
  return cloud.db.collection("data/users/"+cloud.uid).get().then(function(snap){
    var rem={words:{},credits:0,day:"",newToday:0,ts:0,bks:[]},has=false,bk={};
    snap.docs.forEach(function(d){var x=d.data()||{},id=d.id,m;
      if(id==="meta"){has=true;rem.credits=x.credits||0;rem.day=x.day||"";rem.newToday=x.newToday||0;rem.ts=x.ts||0;rem.bks=JSON.parse(JSON.stringify(x.bks||[]))}
      else if(/^w\d+$/.test(id)){has=true;var ws=x.w||{};for(var k in ws)rem.words[k]=JSON.parse(JSON.stringify(ws[k]))}
      else if((m=/^b_(.+)_(m|\d+)$/.exec(id))){(bk[m[1]]=bk[m[1]]||{})[m[2]]=JSON.parse(JSON.stringify(x))}});
    return{rem:rem,has:has,bk:bk}
  })
}
function adopt(rem){
  S=rem;pruneStale(S.words);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  var c=chunkData();cloud.last={};Object.keys(c.str).forEach(function(n){cloud.last[n]=c.str[n]});
  cloud.last.meta=metaStr();cloud.count=wordCount(S.words);cloud.state="cloud";cloud.allow=false;
  if(ui.mode!=="home"&&ui.mode!=="stats"&&ui.mode!=="ipa"&&ui.mode!=="audio")ui={mode:"home"};
  rollDay();
}
/* snapshot = copy of the progress under names b_<key>_<chunk>; the newest MAX_BKS are kept */
function makeSnapshot(key,state){
  var c=chunkData(state.words),jobs=[];
  Object.keys(c.ch).forEach(function(n){jobs.push(function(){return cloud.db.doc(cpath("b_"+key+"_"+n)).set({w:c.ch[n]})})});
  jobs.push(function(){return cloud.db.doc(cpath("b_"+key+"_m")).set({credits:state.credits||0,day:state.day||""})});
  var p=Promise.resolve();jobs.forEach(function(j){p=p.then(j)});
  return p.then(function(){
    var list=(S.bks||[]).filter(function(b){return b.d!==key});
    list.push({d:key,n:wordCount(state.words),r:learnedCount(state.words),t:Date.now()});
    var drop=list.length>MAX_BKS?list.splice(0,list.length-MAX_BKS):[];
    S.bks=list;
    var dj=[];drop.forEach(function(b){for(var n=0;n<16;n++)(function(nn){dj.push(function(){return cloud.db.doc(cpath("b_"+b.d+"_"+nn)).delete()})})(n);dj.push(function(){return cloud.db.doc(cpath("b_"+b.d+"_m")).delete()})});
    var q=Promise.resolve();dj.forEach(function(j){q=q.then(j)});return q
  })
}
function restoreBackup(key){
  return pullRemote().then(function(r){
    var b=r.bk[key];if(!b)throw new Error("no backup");
    var ns={words:{},credits:(b.m&&b.m.credits)||0,day:(b.m&&b.m.day)||"",newToday:0,ts:0,bks:S.bks||[]};
    Object.keys(b).forEach(function(k){if(k!=="m"){var ws=b[k].w||{};for(var id in ws)ns.words[id]=ws[id]}});
    var keep=Object.keys(S.words).length?makeSnapshot(dayKey()+"p",S):Promise.resolve();
    return keep.then(function(){ns.bks=S.bks||[];pruneStale(ns.words);S=ns;cloud.allow=true;save()})
  })
}
function cloudInit(){
  if(!window.claude||!window.claude.use)return;
  var db,user;
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    db=r[0];user=r[1];if(!db||!user)return null;return user.id()
  }).then(function(uid){
    if(!uid)return null;cloud.db=db;cloud.uid=uid;
    return pullRemote()
  }).then(function(r){
    if(!r)return;
    cloud.ok=true;cloud.state="cloud";
    if(r.has&&(!S.ts||r.rem.ts>=(S.ts||0))){adopt(r.rem)}
    else{cloud.last={};cloud.count=r.has?wordCount(r.rem.words):0;if(r.has)S.bks=r.rem.bks;queueSync()}
    render();
    /* daily snapshot of the state as it was before today's work */
    var today=dayKey();
    if(r.has&&wordCount(r.rem.words)>0&&!(S.bks||[]).some(function(b){return b.d===today})){
      makeSnapshot(today,r.rem).then(function(){save();if(ui.mode==="stats")render()},function(){})
    }
  }).catch(function(){})
}
function fmtBk(b){
  var p=String(b.d).replace(/p$/,"").split("-"),d=p.length===3?(("0"+p[2]).slice(-2)+"."+("0"+p[1]).slice(-2)+"."+p[0]):b.d;
  return (/p$/.test(b.d)?"Перед сбросом или возвратом, ":"")+d+" — слов: "+b.n+", выучено: "+b.r;
}
function guardHtml(){
  if(cloud.state!=="guard")return "";
  return '<div class="panel stack" style="border-color:var(--bad)"><h3>Защита прогресса</h3><p class="small" style="margin:0">На этом устройстве слов намного меньше, чем в облаке ('+wordCount(S.words)+' против '+cloud.count+'). Чтобы не потерять прогресс, сохранение в облако остановлено.</p><button class="btn primary" data-act="guard-restore">Вернуть прогресс из облака</button><button class="btn ghost" data-act="guard-force">Всё равно перезаписать облако</button></div>';
}
function bkHtml(){
  if(!cloud.ok)return "";
  var list=(S.bks||[]).slice().reverse();
  var h='<div class="panel stack"><h3>Копии в облаке</h3>';
  if(!list.length)return h+'<p class="muted small" style="margin:0">Копия создаётся раз в день, при первом открытии трейнера. Хранятся последние '+MAX_BKS+'.</p></div>';
  h+='<div class="list">';
  list.forEach(function(b){
    h+='<div class="li"><div class="small">'+esc(fmtBk(b))+'</div>'+(ui.armBk===b.d?'<div class="row"><button class="btn" data-act="bk-cancel">Отмена</button><button class="btn primary" data-act="bk-restore" data-k="'+esc(b.d)+'">Да, вернуть</button></div>':'<button class="btn" data-act="bk-restore" data-k="'+esc(b.d)+'">Вернуть</button>')+'</div>';
  });
  return h+'</div><p class="muted small" style="margin:0">Перед возвратом текущий прогресс тоже сохраняется как копия.</p></div>';
}
function dayKey(){var d=new Date(Date.now()-4*H);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function rollDay(){var k=dayKey();if(S.day!==k){S.day=k;S.newToday=0}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function learning(){return Object.keys(S.words).filter(function(id){return S.words[id].s==="L"}).map(Number)}
function dueList(){var n=Date.now();return Object.keys(S.words).filter(function(id){var w=S.words[id];return w.s==="R"&&w.due<=n}).map(Number).sort(function(a,b){return S.words[a].due-S.words[b].due})}
function reviewList(){return Object.keys(S.words).filter(function(id){return S.words[id].s==="R"}).map(Number)}
function nextNew(n){var out=[];for(var i=0;i<DATA.length&&out.length<n;i++){if(!S.words[DATA[i][0]])out.push(DATA[i][0])}return out}
function newRoom(){var L=learning().length;return Math.max(0,Math.min(MAX_LEARN-L,Math.max(S.credits||0,MIN_ACTIVE-L)))}
function variants(ru){return String(ru).split(";").map(function(x){return x.trim().toLowerCase()}).filter(Boolean)}
function shareVariant(a,b){var va=variants(a),vb=variants(b);return va.some(function(x){return vb.indexOf(x)>=0})}
function shortRu(ru){return String(ru).split(";")[0].trim()}
function fmtDur(ms){
  var m=Math.round(ms/60000);if(m<1)return "меньше минуты";if(m<60)return m+" мин";
  var h=Math.round(ms/H);if(h<48)return h+" ч";var d=Math.round(ms/(24*H));return d+" дн."
}
function speak(t){try{var u=new SpeechSynthesisUtterance(t);u.lang="nl-NL";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0,t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---------- quiz ---------- */
function startQuiz(kind){audioPause();ui={mode:"quiz",kind:kind,recent:[],done:0,ok:0,bad:0,q:null};nextQ()}
function pickWord(){
  if(ui.kind==="review"){var d=dueList();return d.length?d[0]:null}
  var L=learning();if(!L.length)return null;
  var keep=Math.min(3,L.length-1),rec=ui.recent.slice(-keep);
  var c=L.filter(function(id){return rec.indexOf(id)<0});if(!c.length)c=L;
  var tot=0,ws=c.map(function(id){var w=1/(1+S.words[id].c);tot+=w;return w}),r=Math.random()*tot;
  for(var i=0;i<c.length;i++){r-=ws[i];if(r<=0)return c[i]}
  return c[c.length-1];
}
var TYPES=["en-ru","ru-en","type"];
function qType(id){
  var w=S.words[id],opts=TYPES.filter(function(t){return t!==w.lt});
  var t=opts[Math.random()*opts.length|0];w.lt=t;return t;
}
function buildOpts(id,dir){
  var d=BYID.get(id),pool=d[1].indexOf(" ")>=0?PH:SG,opts=[id],g=0;
  if(pool.length<8)pool=DATA.map(function(x){return x[0]});
  while(opts.length<4&&g++<300){
    var r=pool[Math.random()*pool.length|0];if(opts.indexOf(r)>=0)continue;var rd=BYID.get(r);
    var bad=opts.some(function(o){var od=BYID.get(o);return dir==="en-ru"?shareVariant(od[3],rd[3]):od[1]===rd[1]});
    if(!bad)opts.push(r);
  }
  return shuffle(opts);
}
function nextQ(){
  if(ui.kind==="learn"&&newRoom()>0){var nn=nextNew(1);if(nn.length){ui.q={intro:nn[0]};render();window.scrollTo(0,0);return}}
  var id=pickWord();
  if(id==null){ui.q=null;render();return}
  var t=qType(id),q={id:id,type:t,answered:false};
  if(t!=="type")q.opts=buildOpts(id,t);
  ui.q=q;render();
}
function norm(s){return String(s).toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim()}
function lev(a,b){var m=a.length,n=b.length,p=[],i,j;for(j=0;j<=n;j++)p[j]=j;for(i=1;i<=m;i++){var prev=p[0];p[0]=i;for(j=1;j<=n;j++){var t=p[j];p[j]=Math.min(p[j]+1,p[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=t}}return p[n]}
function checkTyped(en,val){
  var a=norm(en),b=norm(val);if(!b)return 0;if(a===b)return 1;
  var st=function(x){return x.replace(/^(to|a|an|the) /,"")};if(st(a)===st(b))return 1;
  if(a.length>=7&&lev(st(a),st(b))<=1)return 2;return 0;
}
function answer(correct,given,note){
  var q=ui.q,w=S.words[q.id];q.answered=true;q.correct=correct;q.given=given;q.note=note||"";ui.done++;
  if(correct){
    ui.ok++;w.ok++;
    if(w.s==="L"){w.c++;w.k=(w.k||0)+1;if(w.k>=STREAK){w.k=0;S.credits++;q.unlocked=true}if(w.c>=w.t){w.s="R";w.st=0;w.due=Date.now()+INT[0];q.grad=true}}
    else{w.st=Math.min(w.st+1,8);w.due=Date.now()+INT[w.st];q.next=INT[w.st]}
  }else{
    ui.bad++;w.bad++;
    if(w.s==="L"){w.c=Math.max(0,w.c-1);w.k=0}
    else{w.s="L";w.c=0;w.k=0;w.t=T_RELAPSE;w.st=0;w.due=0;q.relapsed=true}
  }
  ui.recent.push(q.id);save();render();
  if(correct)speak(BYID.get(q.id)[1]);
}

/* ---------- audio ---------- */
var AUDIO_GAP=900,AUDIO_NEXT=1600;
var audio={playing:false,seq:0,timer:null,order:[],idx:0,current:null};
function audioOrder(){return shuffle(DATA.map(function(d){return d[0]}))}
function speakLang(text,lang,onend){
  try{
    var u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=lang==="ru-RU"?.95:.9;
    u.onend=onend;u.onerror=onend;speechSynthesis.speak(u);
  }catch(e){onend()}
}
function audioStep(seq){
  if(!audio.playing||seq!==audio.seq)return;
  if(audio.idx>=audio.order.length){audio.order=audioOrder();audio.idx=0}
  var d=BYID.get(audio.order[audio.idx++]);
  audio.current=d;if(ui.mode==="audio")render();
  speakLang(d[1],"nl-NL",function(){
    if(!audio.playing||seq!==audio.seq)return;
    audio.timer=setTimeout(function(){
      if(!audio.playing||seq!==audio.seq)return;
      speakLang(shortRu(d[3]),"ru-RU",function(){
        if(!audio.playing||seq!==audio.seq)return;
        audio.timer=setTimeout(function(){audioStep(seq)},AUDIO_NEXT);
      });
    },AUDIO_GAP);
  });
}
function audioPlay(){
  if(audio.playing)return;
  audio.playing=true;audio.seq++;
  if(!audio.order.length)audio.order=audioOrder();
  audioStep(audio.seq);render();
}
function audioPause(){
  if(!audio.playing)return;
  audio.playing=false;audio.seq++;clearTimeout(audio.timer);
  try{speechSynthesis.cancel()}catch(e){}
  if(ui.mode==="audio")render();
}
function renderAudio(){
  var d=audio.current,h='<div class="stack"><div class="panel" style="text-align:center;padding:36px 16px">';
  h+=d?('<div class="word">'+esc(d[1])+'</div><div class="ipa">'+esc(d[2])+'</div><div class="ru" style="margin-top:10px">'+esc(shortRu(d[3]))+'</div>'):'<p class="lead" style="margin:0">Наденьте наушники и нажмите «Играть» — слова на нидерландском и перевод на русском пойдут вперемешку, в случайном порядке.</p>';
  h+='</div><button class="btn primary block" data-act="'+(audio.playing?"audio-pause":"audio-play")+'">'+(audio.playing?"Пауза":"Играть")+'</button>';
  h+='<p class="muted small" style="text-align:center;margin:4px 0 0">Отдельный режим для прослушивания — без связи с прогрессом изучения.</p></div>';
  view.innerHTML=h;
}

/* ---------- lookup (opened from a synonym) ---------- */
function renderLookup(){
  var d=BYID.get(ui.id),w=S.words[ui.id];
  var addBtn=!w?'<button class="btn primary block" data-act="lookup-add" data-id="'+d[0]+'">Добавить к изучению</button>'
    :'<button class="btn block" disabled>'+(w.s==="R"?"Уже выучено":"Уже в изучении")+'</button>';
  var h='<div class="stack"><button class="btn ghost" data-act="lookup-back">← Назад</button>';
  h+='<div class="panel">'+wordHead(d)+'<div class="label">Перевод</div><div class="ru">'+esc(d[3])+'</div>'+details(d)+'</div>';
  h+=addBtn+'</div>';
  view.innerHTML=h;
}

/* ---------- routing ---------- */
function render(){
  document.getElementById("tabs").hidden=(ui.mode==="quiz"||ui.mode==="lookup");
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"),function(b){b.setAttribute("aria-current",String(b.getAttribute("data-tab")===ui.mode))});
  document.getElementById("topinfo").textContent=DATA.length+" слов";
  if(ui.mode==="home")renderHome();else if(ui.mode==="stats")renderStats();else if(ui.mode==="ipa")renderIpa();else if(ui.mode==="audio")renderAudio();else if(ui.mode==="quiz")renderQuiz();else if(ui.mode==="lookup")renderLookup();
}
document.getElementById("tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;ui={mode:b.getAttribute("data-tab")};render();window.scrollTo(0,0)});
view.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;var a=b.getAttribute("data-act");
  if(a==="speak")speak(b.getAttribute("data-t"));
  else if(a==="home"){ui={mode:"home"};render()}
  else if(a==="learn-inline"){var iid=ui.q.intro;if(!S.words[iid]){S.words[iid]={s:"L",c:0,k:0,t:T_NEW,st:0,due:0,ok:0,bad:0};if(S.credits>0)S.credits--;save()}nextQ()}
  else if(a==="practice")startQuiz("learn");
  else if(a==="review")startQuiz("review");
  else if(a==="audio-play")audioPlay();
  else if(a==="audio-pause")audioPause();
  else if(a==="next"){nextQ();window.scrollTo(0,0)}
  else if(a==="pick"){var id=Number(b.getAttribute("data-id"));answer(id===ui.q.id,id)}
  else if(a==="check"){doCheck()}
  else if(a==="idk"){answer(false,null)}
  else if(a==="export"){document.getElementById("bk").value=JSON.stringify(S);document.getElementById("bk").select()}
  else if(a==="import"){var bm=document.getElementById("bkmsg");try{var o=JSON.parse(document.getElementById("bk").value);if(!o||!o.words)throw 0;
      var doImp=function(){o.bks=S.bks||[];pruneStale(o.words);S=o;cloud.allow=true;save();rollDay();ui={mode:"stats",msg:"Прогресс восстановлен."};render()};
      if(cloud.ok&&Object.keys(S.words).length)makeSnapshot(dayKey()+"p",S).then(doImp,doImp);else doImp()
    }catch(err){bm.textContent="Не удалось прочитать копию. Вставьте текст целиком."}}
  else if(a==="reset"){if(!ui.resetArm){ui={mode:"stats",resetArm:true};render();return}
    var fin=function(){S={words:{},day:dayKey(),newToday:0,credits:0,bks:S.bks||[]};cloud.allow=true;save();ui={mode:"stats",msg:"Прогресс стёрт. Вернуть его можно из копий выше."};render()};
    if(cloud.ok&&Object.keys(S.words).length)makeSnapshot(dayKey()+"p",S).then(fin,fin);else fin()}
  else if(a==="reset-cancel"){ui={mode:"stats"};render()}
  else if(a==="bk-restore"){var bkk=b.getAttribute("data-k");if(ui.armBk!==bkk){ui={mode:"stats",armBk:bkk};render();return}
    restoreBackup(bkk).then(function(){ui={mode:"stats",msg:"Прогресс возвращён из копии."};render()},function(){ui={mode:"stats",msg:"Не удалось вернуть копию."};render()})}
  else if(a==="bk-cancel"){ui={mode:"stats"};render()}
  else if(a==="sync")syncNow();
  else if(a==="guard-restore"){pullRemote().then(function(r){if(r.has)adopt(r.rem);render()},function(){})}
  else if(a==="guard-force"){cloud.allow=true;cloud.state="cloud";flush();render()}
  else if(a==="lookup"){var lid=Number(b.getAttribute("data-id"));ui={mode:"lookup",id:lid,back:ui};render();window.scrollTo(0,0)}
  else if(a==="lookup-back"){ui=ui.back||{mode:"home"};render();window.scrollTo(0,0)}
  else if(a==="lookup-add"){var aid=Number(b.getAttribute("data-id"));if(!S.words[aid]){S.words[aid]={s:"L",c:0,k:0,t:T_NEW,st:0,due:0,ok:0,bad:0};if(S.credits>0)S.credits--;save()}render()}
});
view.addEventListener("input",function(e){
  if(e.target.id!=="typed"||ui.mode!=="quiz"||!ui.q||ui.q.answered||ui.q.type!=="type")return;
  var d=BYID.get(ui.q.id);if(norm(e.target.value)===norm(d[1]))answer(true,e.target.value,"");
});
function doCheck(){
  var ti=document.getElementById("typed");if(!ti||!ti.value.trim())return;
  var d=BYID.get(ui.q.id),r=checkTyped(d[1],ti.value);
  answer(r>0,ti.value,r===2?"почти, опечатка засчитана":(r===0?"вы написали: "+ti.value:""));
}
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter"||ui.mode!=="quiz"||!ui.q)return;
  if(ui.q.answered){nextQ();window.scrollTo(0,0)}else if(ui.q.type==="type"){doCheck()}
});
load();render();cloudInit();
})();
</script>

</body></html>
